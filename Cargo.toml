[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
windows = { version = "0.54.0", features = ["Foundation_Numerics", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
navi-state = { path = "crates/navi-state" }
navi-ui = { path = "crates/navi-ui" }
navi-render = { path = "crates/navi-render" }
navi-demo = { path = "crates/navi-demo" }
navi-platform = { path = "crates/navi-platform" }
navi-agent = { path = "crates/navi-agent" }

[profile.release]
lto = true
codegen-units = 1
strip = true
